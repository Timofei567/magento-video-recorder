ServerName localhost

<VirtualHost *:80>
    ServerAdmin webmaster@localhost

    WSGIDaemonProcess video_service python-home=/usr/local python-path=/app
    WSGIProcessGroup video_service
    WSGIApplicationGroup %{GLOBAL}
    WSGIScriptAlias / /app/video_service.wsgi

    <Directory /app>
        <Files video_service.wsgi>
            Require all granted
        </Files>
    </Directory>

    ErrorLog \${APACHE_LOG_DIR}/video-service-error.log
    CustomLog \${APACHE_LOG_DIR}/video-service-access.log combined
</VirtualHost>
